name: CI
on: [push, pull_request]
jobs:
  verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Check Nix files
        run: |
          nix develop --command nixfmt --check flake.nix
          nix develop --command statix check flake.nix
          nix develop --command deadnix --fail flake.nix
      - name: Validate OKF bundle
        run: |
          nix develop --command okq --bundle Knowledge validate --check
          nix develop --command okq --bundle Knowledge deadlinks --check
      - name: Build Lean and check proofs
        run: nix develop --command lake build
